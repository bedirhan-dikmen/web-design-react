# Kerinti website — CasaOS / Docker Compose deployment.
#
#   git clone https://github.com/bedirhan-dikmen/web-design-react.git
#   cd web-design-react
#   cp .env.example .env        # fill in the Cloudflare tunnel token
#   docker compose up -d --build
#
# Full walkthrough (Turkish): DEPLOY.md
#
# Every name below (project, image, containers, network) is unique to this
# repository, so this site runs next to other Kerinti deployments on the same
# server. With shared names Docker treats two sites as one project and each
# deploy replaces the other.

name: web-design-react

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CONTACT_ENDPOINT: ${NEXT_PUBLIC_CONTACT_ENDPOINT:-}
    image: web-design-react:latest
    container_name: web-design-react
    restart: unless-stopped
    ports:
      # Host port for LAN access (http://<server-ip>:3080). Pick a port no
      # other site on the server uses. Cloudflare Tunnel does not need it —
      # it reaches the site over this project's own network.
      - "${WEB_PORT:-3080}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Istanbul}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - web-design-react

  # Cloudflare Tunnel: publishes the site on your domain without opening any
  # port on the router. Started only when the "tunnel" profile is enabled —
  # set COMPOSE_PROFILES=tunnel in .env (see .env.example). In the Cloudflare
  # dashboard, point this tunnel's public hostname at: http://web:3000
  # Use a tunnel of its own, separate from any other site's tunnel.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web-design-react-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Plain default, not ${VAR:?}: Compose interpolates every service, so a
      # required-variable check here would break setups without the tunnel.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - tunnel
    networks:
      - web-design-react

networks:
  web-design-react:
    name: web-design-react

# CasaOS app metadata (shown on the CasaOS dashboard when this compose file is
# imported through "Custom Install"). Ignored by plain Docker Compose.
x-casaos:
  architectures:
    - amd64
    - arm64
  main: web
  author: Kerinti Soft
  category: Web
  title:
    en_us: Kerinti Website (NeXa)
    tr_tr: Kerinti Web Sitesi (NeXa)
  tagline:
    en_us: Kerinti Soft / NeXa website
    tr_tr: Kerinti Soft / NeXa web sitesi
  port_map: "3080"
  scheme: http
  index: /
